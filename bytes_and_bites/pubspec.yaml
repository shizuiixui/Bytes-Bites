name: bytes_and_bites
description: "Bytes & Bites"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/Full Logo.png
  remove_alpha_ios: true
  adaptive_icon_background: "#B0DB9C"

flutter:
  uses-material-design: true

  # Images
  assets:
    - assets/images/Full Logo.png
    - assets/images/Text.png
    - assets/images/bg_image.png
    - assets/images/Grid_pattern.png
    - assets/images/lock_icon.png
    - assets/images/name_page_icon.png

    # Bottom Nav Icons
    - assets/images/bottom_nav_bar/active_home.png
    - assets/images/bottom_nav_bar/active_inventory.png
    - assets/images/bottom_nav_bar/active_profile.png
    - assets/images/bottom_nav_bar/active_transactions.png
    - assets/images/bottom_nav_bar/home.png
    - assets/images/bottom_nav_bar/inventory.png
    - assets/images/bottom_nav_bar/profile.png
    - assets/images/bottom_nav_bar/transactions.png

    # FAB
    - assets/images/bottom_nav_bar/fab.png
    - assets/images/bottom_nav_bar/fab_transactions.png
    - assets/images/bottom_nav_bar/fab_inventory.png
 # Fonts
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
    
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400