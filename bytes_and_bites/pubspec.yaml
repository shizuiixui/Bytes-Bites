name: bytes_and_bites
description: "Bytes & Bites"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/Full Logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Images
  assets:
    - assets/images/Full Logo.png
    - assets/images/Text.png
